<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="reg-page">
  <h1 class="page-title">REGISTRATION FORM</h1>

  <div class="form-container">
    <form id="registrationForm" novalidate>
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        <span class="error-message" id="nameError"></span>
      </div>

      <div class="form-group">
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" placeholder="Enter your address" required>
        <span class="error-message" id="addressError"></span>
      </div>

      <div class="form-group">
        <label for="email">E-mail Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <span class="error-message" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <span class="error-message" id="passwordError"></span>
      </div>

      <div class="form-group">
        <label for="course">Select Your Course:</label>
        <select id="course" name="course" required>
          <option value="">Select Course</option>
          <option value="BTECH">BTECH</option>
          <option value="BBA">BBA</option>
          <option value="BCA">BCA</option>
        </select>
        <span class="error-message" id="courseError"></span>
      </div>

      <div class="form-group">
        <label for="college">College Name:</label>
        <textarea id="college" name="college" rows="4" required></textarea>
        <span class="error-message" id="collegeError"></span>
      </div>

      <div class="form-group checkbox-group">
        <div class="checkbox-wrapper">
          <input type="checkbox" id="agree" name="agree" required>
          <label for="agree" class="checkbox-label">I agree to the above information</label>
        </div>
        <span class="error-message" id="agreeError"></span>
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary" id="btnSend">Send</button>
        <button type="reset" class="btn btn-primary" id="btnReset">Reset</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
