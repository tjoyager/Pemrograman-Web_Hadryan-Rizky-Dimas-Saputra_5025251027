<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <h1 class="form-title">REGISTRATION FORM</h1>
        <div class="form-container">
            <form id="registrasiForm">
                <div class="form-group">
                    <label for="nama">Name:</label>
                    <input type="text" id="nama" name="nama" placeholder="Enter your full name" autocomplete="off">
                    <div id="rekomendasi" class="autocomplete-items"></div>
                </div>

                <div class="form-group">
                    <label for="nrp">NRP:</label>
                    <input type="text" id="nrp" name="nrp" placeholder="Enter your NRP">
                </div>

                <div class="form-group">
                    <label for="jurusan">Jurusan:</label>
                    <select id="jurusan" name="jurusan">
                        <option value="">Pilih Jurusan</option>
                        <option value="Teknik Informatika">Teknik Informatika</option>
                        <option value="Sistem Informasi">Sistem Informasi</option>
                        <option value="Teknologi Informasi">Teknologi Informasi</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="mata_kuliah">Mata Kuliah:</label>
                    <input type="text" id="mata_kuliah" name="mata_kuliah" placeholder="Select Course">
                </div>

                <div class="form-group">
                    <label for="dosen">Dosen:</label>
                    <input type="text" id="dosen" name="dosen" placeholder="Masukkan nama dosen" autocomplete="off">
                    <div id="rekomendasi-dosen" class="autocomplete-items"></div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-submit">Submit</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
