<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Petugas - LibraryReg</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        
        <div class="text-center mb-4">
          <i class="fa-solid fa-book-open-reader fs-1 text-its-blue mb-2"></i>
          <h2 class="fw-bold text-its-blue mb-0">LibraryReg</h2>
          <p class="text-muted small">Portal Pengelolaan Petugas Perpustakaan</p>
        </div>

        <div class="card shadow-sm border-0">
          <div class="card-header bg-its-blue text-white py-3 text-center">
            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-lock me-2 text-its-yellow"></i>Masuk Sistem Petugas</h5>
          </div>
          <div class="card-body p-4 bg-white">

            <div class="alert alert-info border border-info border-opacity-25 bg-its-light text-dark py-2 px-3 mb-3 small">
              <div class="d-flex align-items-center mb-1">
                <i class="fa-solid fa-circle-info text-its-blue me-2"></i>
                <strong class="text-its-blue">Petunjuk Akses:</strong>
              </div>
              <div class="ms-4">
                Username / ID: <code class="text-its-blue fw-bold">admin</code><br>
                Kata Sandi: <code class="text-its-blue fw-bold">123</code>
              </div>
            </div>
            
            <div id="loginAlert"></div>

            <form id="formLogin">
              <div class="mb-3">
                <label for="username" class="form-label fw-bold small">ID Petugas / Username</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-user"></i></span>
                  <input type="text" class="form-control" id="username" placeholder="Masukkan ID Petugas (cth: admin)" required>
                </div>
              </div>
              <div class="mb-4">
                <label for="password" class="form-label fw-bold small">Kata Sandi</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-key"></i></span>
                  <input type="password" class="form-control" id="password" placeholder="Masukkan Kata Sandi" required>
                </div>
              </div>
              <button type="submit" class="btn btn-its-yellow w-100 py-2 mb-3">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Masuk ke Dasbor
              </button>
            </form>

            <hr class="my-3 text-secondary">

            <div class="text-center">
              <a href="index.html" class="btn btn-outline-its w-100 py-2 small">
                <i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Beranda
              </a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
